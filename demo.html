<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Drawing Board</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      color: #242424;
      background: #f3f4f6;
    }

    header {
      padding: 18px 24px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 { margin: 0; font-size: 1.4rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .colors {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 0 1px #ccc;
    }

    .color-button.selected {
      box-shadow: 0 0 0 2px #333;
    }

    input[type="color"] {
      width: 34px;
      height: 34px;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] { width: 110px; }

    button.action {
      padding: 9px 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      font: inherit;
      cursor: pointer;
    }

    button.action:hover { background: #f3f4f6; }
    button.action.active { color: white; background: #333; }

    .spacer { flex: 1; }

    main {
      flex: 1;
      min-height: 300px;
      padding: 18px;
    }

    .canvas-wrap {
      width: 100%;
      height: 100%;
      min-height: 300px;
      overflow: hidden;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 8px #0000000d;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    @media (max-width: 600px) {
      .toolbar { padding: 12px; gap: 10px; }
      header { padding: 14px 16px; }
      main { padding: 12px; }
      .spacer { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 My Drawing Board</h1>
  </header>

  <section class="toolbar" aria-label="Drawing tools">
    <div class="colors" aria-label="Choose a colour">
      <button class="color-button selected" style="background:#222222" data-color="#222222" aria-label="Black"></button>
      <button class="color-button" style="background:#ef4444" data-color="#ef4444" aria-label="Red"></button>
      <button class="color-button" style="background:#f97316" data-color="#f97316" aria-label="Orange"></button>
      <button class="color-button" style="background:#eab308" data-color="#eab308" aria-label="Yellow"></button>
      <button class="color-button" style="background:#22c55e" data-color="#22c55e" aria-label="Green"></button>
      <button class="color-button" style="background:#3b82f6" data-color="#3b82f6" aria-label="Blue"></button>
      <button class="color-button" style="background:#a855f7" data-color="#a855f7" aria-label="Purple"></button>
      <input id="customColor" type="color" value="#222222" aria-label="Custom colour" />
    </div>

    <div class="size-control">
      <label for="brushSize">Brush</label>
      <input id="brushSize" type="range" min="1" max="40" value="6" />
      <span id="sizeValue">6 px</span>
    </div>

    <button id="eraserButton" class="action" type="button">🧽 Eraser</button>
    <span class="spacer"></span>
    <button id="clearButton" class="action" type="button">Clear</button>
    <button id="downloadButton" class="action" type="button">Download</button>
  </section>

  <main>
    <div class="canvas-wrap">
      <canvas id="canvas" aria-label="Drawing canvas"></canvas>
    </div>
  </main>

  <script>
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const brushSize = document.querySelector("#brushSize");
    const sizeValue = document.querySelector("#sizeValue");
    const eraserButton = document.querySelector("#eraserButton");
    const customColor = document.querySelector("#customColor");

    let color = "#222222";
    let drawing = false;
    let erasing = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      // Keep the existing drawing when the canvas is resized.
      const previous = document.createElement("canvas");
      previous.width = canvas.width;
      previous.height = canvas.height;
      if (previous.width && previous.height) {
        previous.getContext("2d").drawImage(canvas, 0, 0);
      }

      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (previous.width && previous.height) {
        ctx.drawImage(previous, 0, 0, previous.width, previous.height,
          0, 0, rect.width, rect.height);
      }
    }

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;
      canvas.setPointerCapture(event.pointerId);
      const { x, y } = getPosition(event);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Number(brushSize.value);
      ctx.strokeStyle = erasing ? "white" : color;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fill();
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing) return;
      const { x, y } = getPosition(event);
      ctx.lineWidth = Number(brushSize.value);
      ctx.strokeStyle = erasing ? "white" : color;
      ctx.lineTo(x, y);
      ctx.stroke();
    });

    function stopDrawing() {
      drawing = false;
      ctx.closePath();
    }

    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);

    document.querySelectorAll(".color-button").forEach((button) => {
      button.addEventListener("click", () => {
        color = button.dataset.color;
        erasing = false;
        eraserButton.classList.remove("active");
        document.querySelectorAll(".color-button").forEach((item) =>
          item.classList.remove("selected")
        );
        button.classList.add("selected");
      });
    });

    customColor.addEventListener("input", () => {
      color = customColor.value;
      erasing = false;
      eraserButton.classList.remove("active");
      document.querySelectorAll(".color-button").forEach((item) =>
        item.classList.remove("selected")
      );
    });

    brushSize.addEventListener("input", () => {
      sizeValue.textContent = `${brushSize.value} px`;
    });

    eraserButton.addEventListener("click", () => {
      erasing = !erasing;
      eraserButton.classList.toggle("active", erasing);
    });

    document.querySelector("#clearButton").addEventListener("click", () => {
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    });

    document.querySelector("#downloadButton").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "my-drawing.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    new ResizeObserver(resizeCanvas).observe(canvas);
  </script>
</body>
</html>
